<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真如苑史全文搜尋</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #27ae60;
            --secondary-color: #2ecc71;
            --return-button-color: #6a89cc;
            --bg-color: #f5f7fa; 
            --text-color: #3d3d3d; 
            --light-text-color: #8c8c8c;
            --border-color: #e0e0e0; 
            --card-bg: #ffffff; 
            --card-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }
        
        #container { 
            max-width: 700px; 
            margin: 20px auto; 
            padding: 40px; 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            border-top: 5px solid var(--primary-color); 
        }

        header { text-align: center; margin-bottom: 30px; }
        
        #home-link { text-decoration: none; color: inherit; display: inline-block; transition: transform 0.2s ease-out; }
        #home-link:hover { transform: scale(1.05); }
        
        h1 { font-family: 'Montserrat', sans-serif; color: var(--primary-color); font-size: 2.2em; display: flex; align-items: center; justify-content: center; gap: 15px; }
        h1 i { font-size: 0.9em; }

        #search-area {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;              
            margin-bottom: 20px;
        }
        
        #keyword-input { 
            width: 100%;
            max-width: 450px; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; font-size: 1em; 
            font-family: inherit; font-weight: 500; 
            color: var(--text-color); 
            transition: all 0.3s;
        }
        #keyword-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.2); }
        
        /* Base style for button group container (Desktop) */
        .button-group {
            display: flex;
            flex-direction: column; /* Stack rows vertically */
            justify-content: center; /* Center rows horizontally */
            gap: 10px; /* Gap between button rows */
            width: 100%;
            max-width: 600px; /* Consistent with index.html */
        }

        /* Styles for button rows (Desktop) */
        .button-row-top,
        .button-row-bottom {
            display: flex;
            justify-content: center;
            gap: 10px; /* Gap between buttons within the row */
            width: 100%; /* Make rows take full width of button-group */
        }

        /* Adjust button widths for desktop layout */
        .button-row-top .action-button {
            flex: 1; /* Distribute space evenly */
            max-width: calc(50% - 5px); /* Two buttons per row with gap */
        }

        .button-row-bottom .action-button {
            /* This single button should take full width of its row on desktop */
            width: 100%; /* Make it fill the entire width of button-row-bottom */
            /* 不再需要 max-width 覆蓋，讓它佔滿父容器 */
        }

        /* General action button styles (applies to all) */
        .action-button {
            padding: 12px 20px;
            border: none;
            color: white;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            white-space: nowrap; /* Prevent text within button from wrapping */
        }
        #search-button { background-color: var(--primary-color); }
        #return-button { background-color: var(--return-button-color); }
        .action-button:hover { transform: translateY(-2px); color: white; }
        #search-button:hover { background-color: var(--secondary-color); }
        #return-button:hover { background-color: #4a69bd; }
        #search-button:disabled { background-color: #b0bec5; cursor: not-allowed; transform: none; }
        
        #divination-button { background-color: #f39c12; }
        #divination-button:hover { background-color: #e67e22; }

        #status { text-align: center; font-weight: 500; min-height: 24px; color: var(--light-text-color); transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #results-wrapper { margin-top: 30px; }
        .result-section { margin-bottom: 25px; display: none; }
        
        .result-section h2 { 
            position: relative; font-size: 1.3em; color: var(--primary-color); 
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); 
            padding-left: 35px; line-height: 1.5;
        }
        .result-section h2 i { position: absolute; left: 0; top: 4px; font-size: 1em; }
        .result-section h2 .highlight { display: inline-block; }
        
        .event-item { background-color: #fdfdff; border-left: 4px solid var(--primary-color); padding: 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; line-height: 1.6; transition: all 0.3s; }
        .event-item:hover { transform: translateX(5px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .highlight { background-color: #f1c40f; color: #333; font-weight: bold; padding: 0 2px; border-radius: 3px; }
        
        #back-to-home-btn { background-color: #e74c3c; }
        #back-to-home-btn:hover { background-color: #c0392b !important; }

        @media print { body * { display: none !important; } }

        @media (max-width: 600px) {
            body { font-size: 17px; }
            #container { margin: 20px 10px; padding: 20px; }
            h1 { font-size: 1.8em; gap: 10px; }
            
            #search-area > #keyword-input {
                width: 90%; 
                max-width: 400px; 
                height: 54px;
                padding: 0 15px; 
                font-size: 1.2em;
                line-height: 54px;
                text-align: center; 
                background-color: #f8f9fa; 
            }
            
            .button-group {
                flex-direction: row; /* Reset to row for mobile */
                flex-wrap: wrap; /* Allows buttons to wrap on mobile */
                width: 90%; 
                max-width: 400px; 
            }

            /* For mobile, make the row wrappers disappear and let buttons be direct flex items of .button-group */
            .button-row-top,
            .button-row-bottom {
                display: contents; 
            }

            /* Apply 50% width to ALL action buttons on mobile */
            .action-button { /* 不再需要 `>`，因為 `display: contents` 使其成為 `button-group` 的直接子元素 */
                width: calc(50% - 5px); /* Mobile specific: 2 buttons per row */
                padding: 12px 5px; 
                flex-grow: 1; 
                max-width: none; /* 移除桌機的 max-width 限制 */
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="container">
        <header>
            <a href="index2.html" id="home-link">
                <h1><i class="bi bi-card-text"></i>真如苑史全文搜尋</h1>
            </a>
        </header>
        <div id="search-area">
            <input type="text" id="keyword-input" placeholder="輸入關鍵字，例如：攝受心院...">
            <div class="button-group">
                <div class="button-row-top">
                    <button id="search-button" class="action-button"><i class="bi bi-search"></i>搜尋</button>
                    <a href="https://angewoo.github.io/Train17/index4.html" id="divination-button" class="action-button" target="_blank" rel="noopener noreferrer"><i class="bi bi-ticket-perforated"></i>苑史抽籤</a>
                </div>
                <div class="button-row-bottom">
                    <a href="index.html" id="return-button" class="action-button"><i class="bi bi-calendar-heart"></i>回到苑史上的今天</a>
                </div>
            </div>
        </div>
        <div id="status">請輸入關鍵字進行搜尋</div>
        <div id="results-wrapper">
            <div id="search-results-section" class="result-section">
                <h2><!-- 內容由 JS 動態生成 --></h2>
                <div class="content"></div>
            </div>
        </div>
        <div id="home-button-container" style="text-align: center; margin-top: 30px; display: none;">
            <button id="back-to-home-btn" class="action-button">
                <i class="bi bi-arrow-clockwise"></i>回首頁
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('keydown', function(e) {
          if (e.ctrlKey && ('scpu'.indexOf(e.key) !== -1)) {
            e.preventDefault();
          }
        });
    </script>
    
    <script>
        // 將 sheetUrl 改為 CSV 導出的 URL
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSELNOgRozrKO1bscsHe6doF8rH9-wSPYgvkhR5xXGhHKYvKoiXnlEC8YR3G5pPwQ2YFOksnlxYAQx-/pub?gid=0&single=true&output=csv';

        const keywordInput = document.getElementById("keyword-input");
        const searchButton = document.getElementById("search-button");
        const statusEl = document.getElementById("status");
        const resultsSection = document.getElementById("search-results-section");
        const resultsHeader = resultsSection.querySelector("h2");
        const homeButtonContainer = document.getElementById("home-button-container");

        function normalizeString(str) {
            if (!str) return '';
            // 將全形數字轉換為半形數字，以及處理全形空格等
            return str.replace(/[Ａ-Ｚａ-ｚ０-９　]/g, s => {
                if (s === '　') return ' '; // 全形空格轉半形空格
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            }).trim(); // 移除首尾空格
        }

        function resetResults(){
            resultsSection.style.display="none";
            resultsSection.querySelector(".content").innerHTML="";
            resultsHeader.innerHTML="";
            homeButtonContainer.style.display="none";
        }

        async function fetchAndProcessData(processor){
            statusEl.innerHTML='<i class="bi bi-hourglass-split spinner"></i>正在資料庫中檢索...';
            searchButton.disabled=true;
            keywordInput.disabled=true;
            console.log('Attempting to fetch data from:', sheetUrl); // 新增 log
            try{
                const response = await fetch(sheetUrl);
                if(!response.ok) {
                    console.error('Fetch response not OK:', response.status, response.statusText); // 新增 log
                    throw new Error(`網路錯誤 (狀態碼: ${response.status})`);
                }
                const csvText = await response.text();
                console.log('Successfully fetched CSV text (first 500 chars):', csvText.substring(0, 500) + (csvText.length > 500 ? '...' : '')); // 新增 log
                
                // 解析 CSV 資料
                const lines = csvText.split('\n');
                console.log('CSV lines count:', lines.length); // 新增 log
                const dataRows = [];
                // 假設第一行是標題行，從第二行開始處理
                for (let i = 1; i < lines.length; i++) { 
                    const line = lines[i].trim();
                    if (line) {
                        // 這裡使用和 index.html 相同的 CSV 解析邏輯
                        // 找到日期字串後的第一個空格，將其分割成兩部分
                        const datePatternForSplit = /(\d{4}年\d{1,2}月\d{1,2}日)\s*(.*)/;
                        const match = line.match(datePatternForSplit);

                        if (match && match.length >= 3) {
                            const datePart = match[1].trim(); // 第一組是日期
                            const eventPart = match[2].trim(); // 第二組是事件描述
                            dataRows.push([datePart, eventPart]);
                        } else {
                            console.warn(`Skipped malformed row ${i} (no date pattern match or insufficient columns):`, line); // 新增 log
                        }
                    }
                }
                console.log('Final parsed dataRows count:', dataRows.length); // 新增 log
                console.log('First 5 parsed dataRows:', dataRows.slice(0, 5)); // 新增 log
                processor(dataRows); // 將解析後的二維陣列傳遞給處理器
            }catch(e){
                statusEl.innerHTML=`<i class="bi bi-x-octagon-fill"></i>讀取資料時發生錯誤: ${e.message}`;
                console.error("Fetch or process data error:", e); // 輸出錯誤到控制台
            }finally{
                searchButton.disabled=false;
                keywordInput.disabled=false;
            }
        }

        function searchByKeyword(){
            resetResults();
            let keyword = keywordInput.value.trim();
            if(keyword){
                fetchAndProcessData(dataRows => { // dataRows 現在是 [[日期, 事件描述], [日期, 事件描述], ...]
                    let foundEvents = [];
                    const lowerCaseKeyword = normalizeString(keyword).toLowerCase(); // 標準化並轉小寫，用於匹配

                    for (const row of dataRows) {
                        const rawDateText = row[0]; // 日期字串
                        const eventDescription = row[1]; // 事件描述字串

                        // 將日期和事件描述組合起來進行全文搜尋
                        const fullEventText = `${rawDateText} ${eventDescription}`;
                        const normalizedFullEventText = normalizeString(fullEventText).toLowerCase();
                        
                        if (normalizedFullEventText.includes(lowerCaseKeyword)) {
                            foundEvents.push(fullEventText);
                        }
                    }

                    if(foundEvents.length > 0){
                        resultsSection.style.display="block";
                        let title=`找到 ${foundEvents.length} 筆關於「<span class="highlight">${keyword}</span>」的事件`;
                        resultsHeader.innerHTML=`<i class="bi bi-card-checklist"></i>${title}`;
                        
                        // 用正則表達式來替換關鍵字並高亮顯示
                        // 使用 'gi' 旗標表示全域 (g) 和不區分大小寫 (i)
                        const highlightRegex = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi"); // 關鍵字中的特殊字符需要轉義
                        
                        let eventsHtml = foundEvents.map(event => {
                            let highlightedEvent = event.replace(highlightRegex, `<span class="highlight">$&</span>`);
                            return `<div class="event-item">${highlightedEvent}</div>`;
                        }).join("");
                        
                        resultsSection.querySelector(".content").innerHTML=eventsHtml;
                        statusEl.innerHTML='<i class="bi bi-check-circle-fill"></i>搜尋完成！';
                    }else{
                        statusEl.innerHTML=`<i class="bi bi-emoji-frown"></i>找不到與「${keyword}」相關的事件。`;
                    }
                    homeButtonContainer.style.display="block";
                });
            }else{
                statusEl.innerHTML='<i class="bi bi-exclamation-circle"></i>請先輸入要搜尋的關鍵字！';
            }
        }

        searchButton.addEventListener("click",searchByKeyword);
        keywordInput.addEventListener("keypress",e=>{"Enter"===e.key&&searchByKeyword()});
        document.getElementById("back-to-home-btn").addEventListener("click",()=>location.reload());
    </script>
</body>
</html>
