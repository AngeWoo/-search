<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苑史上的今天 - 事件查詢</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #6a89cc; 
            --secondary-color: #4a69bd; 
            --today-event-color: #d35400;
            --bg-color: #f5f7fa; 
            --text-color: #3d3d3d; 
            --light-text-color: #8c8c8c;
            --border-color: #e0e0e0; 
            --card-bg: #ffffff; 
            --card-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }
        
        #container { 
            max-width: 700px; 
            margin: 20px auto; 
            padding: 40px; 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            border-top: 5px solid var(--primary-color); 
        }
        header { text-align: center; margin-bottom: 30px; }
        
        #home-link { text-decoration: none; color: inherit; display: inline-block; transition: transform 0.2s ease-out; }
        #home-link:hover { transform: scale(1.05); }
        
        h1 { font-family: 'Montserrat', sans-serif; color: var(--primary-color); font-size: 2.2em; display: flex; align-items: center; justify-content: center; gap: 15px; }
        h1 i { font-size: 0.9em; }
        
        #search-area {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;              
            margin-bottom: 20px;
        }
        
        /* 電腦版日期輸入框樣式 (恢復原始) */
        #date-input { 
            width: 100%;
            max-width: 450px; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; font-size: 1em; 
            font-family: inherit; 
            font-weight: 500; 
            color: var(--text-color); 
            transition: all 0.3s;
            text-align: center; 
        }
        #date-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(106, 137, 204, 0.2); }
        
        /* 電腦版按鈕組容器樣式 (恢復原始) */
        .button-group {
            display: flex;
            flex-direction: column; /* Stack rows vertically */
            justify-content: center; /* Center rows horizontally */
            gap: 10px; /* Gap between button rows */
            width: 100%;
            max-width: 600px; /* 電腦版按鈕組最大寬度 (恢復原始) */
        }

        /* 電腦版按鈕行樣式 (恢復原始) */
        .button-row-top,
        .button-row-bottom {
            display: flex;
            justify-content: center;
            gap: 10px; /* Gap between buttons within the row */
            width: 100%; /* Make rows take full width of button-group */
        }

        /* 電腦版按鈕寬度樣式 (恢復原始) */
        .button-row-top .action-button {
            flex: 1; /* Distribute space evenly */
            max-width: calc(50% - 5px); /* Two buttons per row with gap */
        }

        .button-row-bottom .action-button {
            flex: 1; /* Distribute space evenly */
            max-width: calc(33.333% - 6.666px); /* Three buttons per row with gap */
        }


        /* 全局按鈕樣式 (恢復原始，white-space: nowrap; 在這裡) */
        .action-button {
            padding: 12px 20px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            white-space: nowrap; /* Prevent text within button from wrapping */
            text-decoration: none;
        }
        .action-button:hover { background-color: var(--secondary-color); transform: translateY(-2px); color: white; }
        .action-button:disabled { background-color: #b0bec5; cursor: not-allowed; transform: none; }
        
        #event-search-button { background-color: #27ae60; }
        #event-search-button:hover { background-color: #229954; }
        #divination-button { background-color: #f39c12; }
        #divination-button:hover { background-color: #e67e22; }
        #today-search-button { background-color: #1abc9c; }
        #today-search-button:hover { background-color: #16a085; }

        #status { text-align: center; font-weight: 500; min-height: 24px; color: var(--light-text-color); transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #results-wrapper { margin-top: 30px; }
        .result-section { margin-bottom: 25px; display: none; }
        .result-section h2 { font-size: 1.3em; color: var(--secondary-color); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .event-item { background-color: #fdfdff; border-left: 4px solid var(--primary-color); padding: 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; line-height: 1.6; transition: all 0.3s; }
        .event-item:hover { transform: translateX(5px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        
        #today-events-section h2 { color: var(--today-event-color); }
        #today-events-section .event-item { border-left-color: var(--today-event-color); }

        #fallback-options { display: none; margin-top: 20px; padding: 20px; background-color: rgba(106, 137, 204, 0.05); border-radius: 10px; text-align: center; }
        #fallback-options p { margin-bottom: 15px; font-weight: 500; }
        .fallback-buttons { display: flex; justify-content: center; gap: 15px; }
        .fallback-btn { background-color: transparent; color: var(--primary-color); border: 2px solid var(--primary-color); padding: 8px 15px; border-radius: 8px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .fallback-btn:hover { background-color: var(--primary-color); color: white; }
        
        #back-to-home-btn:hover { background-color: #c0392b !important; }

        @media print { body * { display: none !important; } }

        /* 手機瀏覽樣式 (僅在此媒體查詢內修改) */
        @media (max-width: 600px) {
            body { font-size: 17px; }
            #container { margin: 20px 10px; padding: 20px; }
            h1 { font-size: 1.8em; gap: 10px; }
            
            /* 手機版日期輸入框寬度調整 */
            #search-area > #date-input {
                width: 90%; 
                max-width: 400px; /* 恢復合理的最大寬度 */
                height: 54px;
                padding: 0 15px; 
                font-size: 1.2em;
                line-height: 54px;
                background-color: #f8f9fa; 
            }
            
            /* 手機版按鈕組容器樣式：總寬度與日期框對齊 */
            .button-group {
                width: 90%; 
                max-width: 400px; /* 按鈕組總寬度與日期框對齊 */
                /* 繼承桌面版 flex-direction: column; 和 justify-content: center; */
                /* 繼承桌面版 gap: 10px; */
            }

            /* 手機版按鈕行樣式：確保每行按鈕寬度一致 */
            .button-row-top,
            .button-row-bottom {
                /* 繼承桌面版 display: flex; justify-content: center; gap: 10px; */
                width: 100%; /* 確保按鈕行佔滿按鈕組的寬度 */
            }

            /* 手機版按鈕樣式：調整內邊距和字體大小 */
            .action-button {
                padding: 12px 6px; /* 調整內邊距避免超出 */
                font-size: 0.9em; /* 稍微縮小字體 */
                /* white-space: nowrap; 保持全局生效 */
            }

            /* 手機版按鈕寬度分配：移除最小寬度限制，讓flex自然分配 */
            .button-row-top .action-button {
                flex: 1; /* 第一行兩個按鈕平均分配空間 */
                max-width: calc(50% - 5px); /* 確保兩個按鈕能並排且有間隙 */
                /* 移除 min-width，讓按鈕自適應 */
            }

            .button-row-bottom .action-button {
                flex: 1; /* 第二行三個按鈕平均分配空間 */
                max-width: calc(33.333% - 6.666px); /* 確保三個按鈕能並排且有間隙 */
                /* 移除 min-width，讓按鈕自適應 */
            }

            /* 確保 fallback 按鈕在手機上垂直堆疊 */
            .fallback-buttons { flex-direction: column; }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="container">
        <header>
            <a href="index.html" id="home-link">
                <h1><i class="bi bi-calendar-heart"></i>苑史上的今天</h1>
            </a>
        </header>
        <div id="search-area">
            <input type="date" id="date-input">
            <div class="button-group">
                <div class="button-row-top">
                    <button id="search-button" class="action-button"><i class="bi bi-search"></i>查詢</button>
                    <button id="random-search-button" class="action-button"><i class="bi bi-shuffle"></i>隨機查詢</button>
                </div>
                <div class="button-row-bottom">
                    <button id="today-search-button" class="action-button"><i class="bi bi-calendar-event"></i>今日事件</button>
                    <a href="https://angewoo.github.io/Train17/index4.html" id="divination-button" class="action-button" target="_blank" rel="noopener noreferrer"><i class="bi bi-ticket-perforated"></i>苑史抽籤</a>
                    <a href="index2.html" id="event-search-button" class="action-button"><i class="bi bi-card-text"></i>事件搜尋</a>
                </div>
            </div>
        </div>
        <div id="status">請選擇日期，回顧歷史的足跡</div>
        <div id="results-wrapper">
            <div id="today-events-section" class="result-section">
                <h2><i class="bi bi-star-fill"></i>今天事件</h2>
                <div class="content"></div>
            </div>
            <div id="this-month-events-section" class="result-section">
                <h2><i class="bi bi-calendar3"></i>本月事件</h2>
                <div class="content"></div>
            </div>
            <div id="fallback-options">
                <p><i class="bi bi-lightbulb"></i>找不到當日事件，是否要擴大搜尋？</p>
                <div class="fallback-buttons">
                    <button id="search-year-btn" class="fallback-btn"><i class="bi bi-calendar-week"></i>搜尋當年所有事件</button>
                    <button id="search-month-btn" class="fallback-btn"><i class="bi bi-calendar-month"></i>搜尋當月所有事件</button>
                </div>
            </div>
        </div>
        <div id="home-button-container" style="text-align: center; margin-top: 30px; display: none;">
            <button id="back-to-home-btn" class="action-button" style="background-color: #e74c3c;">
                <i class="bi bi-arrow-clockwise"></i>回首頁
            </button>
        </div>
    </div>
    
    <script>
        // 禁止組合鍵
        document.addEventListener('keydown', function(e) {
          if (e.ctrlKey && ('scpu'.indexOf(e.key) !== -1)) {
            e.preventDefault();
          }
        });

        // --- 恢復完整的 JavaScript 程式碼 ---
        // 直接使用 Google Sheets 的 CSV URL，不再透過 allorigins.win 代理
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSELNOgRozrKO1bscsHe6doF8rH9-wSPYgvkhR5xXGhHKYvKoiXnlEC8YR3G5pPwQ2YFOksnlxYAQx-/pub?gid=0&single=true&output=csv';

        const dateInput = document.getElementById('date-input');
        const searchButton = document.getElementById('search-button');
        const randomSearchButton = document.getElementById('random-search-button');
        const todaySearchButton = document.getElementById('today-search-button');
        const statusEl = document.getElementById('status');
        const todaySection = document.getElementById('today-events-section');
        const monthSection = document.getElementById('this-month-events-section');
        const fallbackSection = document.getElementById('fallback-options');
        const homeButtonContainer = document.getElementById('home-button-container');

        function normalizeString(str) {
            if (!str) return '';
            // 將全形數字轉換為半形數字，以及處理全形空格等
            return str.replace(/[Ａ-Ｚａ-ｚ０-９　]/g, s => {
                if (s === '　') return ' '; // 全形空格轉半形空格
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            }).trim(); // 移除首尾空格
        }

        function resetResultAreas() {
            todaySection.style.display = 'none';
            monthSection.style.display = 'none';
            fallbackSection.style.display = 'none';
            homeButtonContainer.style.display = 'none';
            todaySection.querySelector('.content').innerHTML = '';
            monthSection.querySelector('.content').innerHTML = '';
        }

        async function fetchAndProcessData(processor) {
            statusEl.innerHTML = '<i class="bi bi-hourglass-split spinner"></i>正在時光機中穿梭...';
            searchButton.disabled = true;
            randomSearchButton.disabled = true;
            console.log('Attempting to fetch data from:', sheetUrl); // 新增 log
            try {
                const response = await fetch(sheetUrl); 
                if (!response.ok) {
                    console.error('Fetch response not OK:', response.status, response.statusText); // 新增 log
                    throw new Error(`網路錯誤 (狀態碼: ${response.status})`);
                }
                const csvText = await response.text();
                console.log('Successfully fetched CSV text (first 500 chars):', csvText.substring(0, 500) + (csvText.length > 500 ? '...' : '')); // 新增 log
                
                // 解析 CSV 資料
                const lines = csvText.split('\n');
                console.log('CSV lines count:', lines.length); // 新增 log
                const dataRows = [];
                // 假設第一行是標題行，從第二行開始處理
                for (let i = 1; i < lines.length; i++) { 
                    const line = lines[i].trim();
                    if (line) {
                        // *** 修正點：根據實際的 CSV 格式，使用更簡單的分割邏輯
                        // 嘗試找到日期字串後的第一個空格，將其分割成兩部分
                        const datePatternForSplit = /(\d{4}年\d{1,2}月\d{1,2}日)\s*(.*)/;
                        const match = line.match(datePatternForSplit);

                        if (match && match.length >= 3) {
                            const datePart = match[1].trim(); // 第一組是日期
                            const eventPart = match[2].trim(); // 第二組是事件描述
                            dataRows.push([datePart, eventPart]);
                            // console.log(`Processed row ${i}:`, [datePart, eventPart]); // 每個處理後的行都打 log，必要時再開啟
                        } else {
                            console.warn(`Skipped malformed row ${i} (no date pattern match or insufficient columns):`, line); // 新增 log
                        }
                    }
                }
                console.log('Final parsed dataRows count:', dataRows.length); // 新增 log
                console.log('First 5 parsed dataRows:', dataRows.slice(0, 5)); // 新增 log
                processor(dataRows); // 將解析後的二維陣列傳遞給處理器
            } catch (error) {
                statusEl.innerHTML = `<i class="bi bi-x-octagon-fill"></i>讀取資料時發生錯誤: ${error.message}`;
                console.error("Fetch or process data error:", error); // 輸出錯誤到控制台
            } finally {
                searchButton.disabled = false;
                randomSearchButton.disabled = false;
            }
        }
        
        function searchForDate() {
            resetResultAreas();
            const selectedDate = dateInput.value;
            if (!selectedDate) {
                statusEl.innerHTML = '<i class="bi bi-exclamation-circle"></i>請先選擇一個有效的日期！';
                return;
            }
            const dateObj = new Date(selectedDate);
            const targetYear = dateObj.getFullYear();
            const targetMonth = dateObj.getMonth() + 1;
            const targetDay = dateObj.getDate();
            console.log(`Searching for date: ${targetYear}年${targetMonth}月${targetDay}日`); // 新增 log

            fetchAndProcessData(rows => { // rows 現在是一個二維陣列，每項是 [日期字串, 事件描述字串]
                let todayEvents = [], thisMonthEvents = [];
                // 修正日期解析正則表達式，使其更嚴謹地匹配開頭的日期部分
                const datePartsPattern = /(\d+)年(\d+)月(\d+)日/; 

                for (const row of rows) {
                    const rawDateText = row[0]; // 取得日期欄位 (CSV 第一欄)
                    const eventDescription = row[1]; // 取得事件描述欄位 (CSV 第二欄)

                    // 如果 rawDateText 或 eventDescription 為空，則跳過此行，避免錯誤
                    if (!rawDateText || !eventDescription) {
                        // console.log('Skipping row due to empty date or description:', row); // 太多 log 時可註解
                        continue; 
                    }

                    const normalizedDateText = normalizeString(rawDateText);
                    const match = normalizedDateText.match(datePartsPattern);

                    // console.log('Processing row:', rawDateText, eventDescription); // 除錯用：顯示原始行
                    // console.log('Normalized Date Text:', normalizedDateText); // 除錯用：顯示標準化後的日期文字
                    // console.log('Date Regex Match:', match); // 除錯用：顯示正則匹配結果

                    if (match) {
                        const eventYear = parseInt(match[1], 10);
                        const eventMonth = parseInt(match[2], 10);
                        const eventDay = parseInt(match[3], 10);

                        const fullEventString = `${rawDateText} ${eventDescription}`; // 組合成完整顯示字串

                        if (eventYear === targetYear && eventMonth === targetMonth && eventDay === targetDay) {
                            todayEvents.push(fullEventString);
                            // console.log('Match found for today:', fullEventString); // 新增 log
                        }
                        // 如果只需要顯示與當前選定日期同月同日的事件 (不限年份)
                        // 且該事件尚未被納入todayEvents，則加入thisMonthEvents
                        if (eventMonth === targetMonth && eventDay === targetDay) {
                             thisMonthEvents.push(fullEventString);
                        }
                    } else {
                        // console.log('No date match for:', normalizedDateText); // 除錯用：顯示未能匹配的日期
                    }
                }
                
                console.log('Today Events Found:', todayEvents.length, todayEvents); // 新增 log
                console.log('This Month Events Found (before filtering):', thisMonthEvents.length, thisMonthEvents); // 新增 log

                let foundSomething = false;
                if (todayEvents.length > 0) {
                    todaySection.style.display = 'block';
                    todaySection.querySelector('h2').innerHTML = '<i class="bi bi-star-fill"></i>今天事件';
                    todaySection.querySelector('.content').innerHTML = todayEvents.map(event => `<div class="event-item">${event}</div>`).join('');
                    foundSomething = true;
                }
                
                // 修正：篩選出不在今天事件中的本月事件，避免重複顯示
                const uniqueThisMonthEvents = thisMonthEvents.filter(event => !todayEvents.includes(event));
                console.log('Unique This Month Events Found:', uniqueThisMonthEvents.length, uniqueThisMonthEvents); // 新增 log

                if (uniqueThisMonthEvents.length > 0) {
                    monthSection.style.display = 'block';
                    monthSection.querySelector('h2').innerHTML = '<i class="bi bi-calendar3"></i>本月事件'; // 確保標題正確
                    monthSection.querySelector('.content').innerHTML = uniqueThisMonthEvents.map(event => `<div class="event-item">${event}</div>`).join('');
                    foundSomething = true;
                }

                if (foundSomething) {
                    statusEl.innerHTML = `<i class="bi bi-check-circle-fill"></i>查詢完成！`;
                } else {
                    statusEl.innerHTML = `<i class="bi bi-emoji-frown"></i>在這一天，歷史似乎打盹了。`;
                    fallbackSection.style.display = 'block';
                }
                homeButtonContainer.style.display = 'block';
            });
        }

        function searchByScope(scope) {
            resetResultAreas();
            const selectedDate = dateInput.value;
            if (!selectedDate) {
                statusEl.innerHTML = '<i class="bi bi-exclamation-circle"></i>請先選擇日期再擴大搜尋！';
                return;
            }
            const dateObj = new Date(selectedDate);
            let title;
            const year = dateObj.getFullYear();
            const month = dateObj.getMonth() + 1;
            console.log(`Searching by scope: ${scope}. Target Year: ${year}, Target Month: ${month}`); // 新增 log

            if (scope === 'year') {
                title = `<i class="bi bi-calendar-week"></i>${year}年的所有事件`;
            } else { // scope === 'month'
                title = `<i class="bi bi-calendar-month"></i>${month}月的所有事件`;
            }

            fetchAndProcessData(rows => { // rows 現在是一個二維陣列
                let foundEvents = [];
                const datePartsPattern = /(\d+)年(\d+)月(\d+)日/;
                const yearPattern = new RegExp(`^${year}年`);

                for (const row of rows) {
                    const rawDateText = row[0]; 
                    const eventDescription = row[1];

                    if (!rawDateText || !eventDescription) continue; 

                    const normalizedDateText = normalizeString(rawDateText);
                    const fullEventString = `${rawDateText} ${eventDescription}`; // 組合成完整顯示字串
                    
                    if (scope === 'month') {
                         const match = normalizedDateText.match(datePartsPattern);
                         if (match) {
                             const eventMonth = parseInt(match[2], 10);
                             if(eventMonth === month) {
                                 foundEvents.push(fullEventString);
                             }
                         }
                    } else { // scope === 'year'
                        if (yearPattern.test(normalizedDateText)) {
                            foundEvents.push(fullEventString);
                        }
                    }
                }
                
                console.log(`Events found for scope '${scope}':`, foundEvents.length, foundEvents); // 新增 log

                if (foundEvents.length > 0) {
                    todaySection.style.display = 'block';
                    todaySection.querySelector('h2').innerHTML = title;
                    todaySection.querySelector('.content').innerHTML = foundEvents.map(event => `<div class="event-item">${event}</div>`).join('');
                    statusEl.innerHTML = `<i class="bi bi-check-circle-fill"></i>擴大搜尋完成！`;
                } else {
                    statusEl.innerHTML = `<i class="bi bi-search"></i>在指定範圍內沒有找到任何事件。`;
                }
                homeButtonContainer.style.display = 'block';
            });
        }
        
        function searchForToday() {
            dateInput.valueAsDate = new Date();
            searchForDate();
        }

        function randomSearch() {
            const startDate = new Date('1935-12-28');
            const endDate = new Date(); 
            const startTime = startDate.getTime();
            const endTime = endDate.getTime();
            const randomTime = startTime + Math.random() * (endTime - startTime);
            const randomDate = new Date(randomTime);
            dateInput.valueAsDate = randomDate;
            searchForDate();
        }

        searchButton.addEventListener('click', searchForDate);
        dateInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') searchForDate(); });
        document.getElementById('search-year-btn').addEventListener('click', () => searchByScope('year'));
        document.getElementById('search-month-btn').addEventListener('click', () => searchByScope('month'));
        randomSearchButton.addEventListener('click', randomSearch);
        todaySearchButton.addEventListener('click', searchForToday);
        document.getElementById('back-to-home-btn').addEventListener('click', () => location.reload());

        // 這就是恢復預設查詢功能的關鍵程式碼
        document.addEventListener('DOMContentLoaded', () => {
            const defaultDate = new Date('1935-12-28');
            dateInput.valueAsDate = defaultDate;
            searchForDate();
        });
    </script>
</body>
</html>
